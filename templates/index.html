<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Gateway</title>
<style>
:root {
  --bg: #0f0f0f;
  --fg: #ccc;
  --card-bg: #1a1a1a;
  --card-border: #2a2a2a;
  --heading: #fff;
  --muted: #555;
  --dim: #888;
  --link: #555;
  --btn-bg: #1a1a1a;
  --btn-border: #2a2a2a;
  --btn-fg: #888;
  --btn-active-bg: #2563eb;
  --btn-active-border: #3b82f6;
  --btn-active-fg: #fff;
  --table-border: #1a1a1a;
  --chart-grid: #1a1a1a;
  --tooltip-bg: #1a1a1a;
  --tooltip-border: #2a2a2a;
  --tooltip-title: #ccc;
  --tooltip-body: #888;
  --empty: #444;
}
[data-theme="light"] {
  --bg: #f5f5f5;
  --fg: #333;
  --card-bg: #fff;
  --card-border: #e5e7eb;
  --heading: #111;
  --muted: #9ca3af;
  --dim: #6b7280;
  --link: #9ca3af;
  --btn-bg: #fff;
  --btn-border: #e5e7eb;
  --btn-fg: #6b7280;
  --btn-active-bg: #2563eb;
  --btn-active-border: #3b82f6;
  --btn-active-fg: #fff;
  --table-border: #f3f4f6;
  --chart-grid: #f3f4f6;
  --tooltip-bg: #fff;
  --tooltip-border: #e5e7eb;
  --tooltip-title: #111;
  --tooltip-body: #6b7280;
  --empty: #9ca3af;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); padding: 20px; }
.container { max-width: 720px; margin: 0 auto; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
h1 { font-size: 15px; color: var(--heading); font-weight: 600; }
.toolbar { display: flex; gap: 6px; align-items: center; }
.toolbar button { background: var(--btn-bg); border: 1px solid var(--btn-border); color: var(--btn-fg); padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: 11px; line-height: 1; }
a { color: var(--link); font-size: 12px; text-decoration: none; }
.controls { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
.controls button { background: var(--btn-bg); border: 1px solid var(--btn-border); color: var(--btn-fg); padding: 6px 14px; border-radius: 5px; cursor: pointer; font-size: 12px; }
.controls button.active { background: var(--btn-active-bg); border-color: var(--btn-active-border); color: var(--btn-active-fg); }
.stats { display: flex; gap: 12px; margin-bottom: 20px; }
.stat { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 14px 18px; flex: 1; }
.stat .n { font-size: 24px; font-weight: 700; color: var(--heading); }
.stat .l { font-size: 11px; color: var(--muted); margin-top: 2px; }
.stat .mom { font-size: 11px; margin-top: 4px; display: none; color: var(--muted); }
.stat .mom.up { color: #22c55e; }
.stat .mom.down { color: #ef4444; }
.section { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
.section h2 { font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
td, th { padding: 7px 8px; border-bottom: 1px solid var(--table-border); text-align: left; color: var(--dim); }
th { color: var(--muted); font-weight: 500; }
td:last-child, th:last-child { text-align: right; }
.empty { color: var(--empty); text-align: center; padding: 24px; font-size: 13px; }
.pages { display: flex; gap: 4px; justify-content: center; margin-top: 10px; }
.pages button { background: var(--btn-bg); border: 1px solid var(--btn-border); color: var(--btn-fg); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
.pages button.active { background: var(--btn-active-bg); border-color: var(--btn-active-border); color: var(--btn-active-fg); }
.section .chart-wrap { height: 160px; position: relative; }
[data-layout="kanban"] body { height: 100vh; overflow: hidden; padding: 12px; }
[data-layout="kanban"] .container { max-width: 1200px; height: 100%; display: flex; flex-direction: column; gap: 10px; }
[data-layout="kanban"] .header,
[data-layout="kanban"] .controls { margin-bottom: 0; flex-shrink: 0; }
[data-layout="kanban"] .kanban-main { flex: 1; min-height: 0; display: flex; gap: 12px; overflow: hidden; }
[data-layout="kanban"] .kanban-left { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: hidden; }
[data-layout="kanban"] .kanban-right { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
[data-layout="kanban"] .kanban-left .stats { margin-bottom: 0; flex-shrink: 0; }
[data-layout="kanban"] .kanban-left .section,
[data-layout="kanban"] .kanban-right .section { margin-bottom: 0; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
[data-layout="kanban"] .chart-wrap { flex-shrink: 0; }
[data-layout="kanban"] #billingList { flex: 1; overflow-y: auto; min-height: 0; }
[data-layout="kanban"] .table-scroll { flex: 1; overflow-y: auto; min-height: 0; }
[data-layout="kanban"] .pages { flex-shrink: 0; margin-top: 8px; }
[data-layout="kanban"] h2 { flex-shrink: 0; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 id="pageTitle">AI Gateway</h1>
    <div class="toolbar">
      <button id="layoutBtn" onclick="toggleLayout()">看板</button>
      <button id="themeBtn" onclick="toggleTheme()">Light</button>
      <button id="langBtn" onclick="toggleLang()">EN</button>
    </div>
  </div>

  <div class="controls">
    <button data-range="1h" data-i18n="range1h">1小时</button>
    <button data-range="24h" data-i18n="range24h" class="active">24小时</button>
    <button data-range="7d" data-i18n="range7d">7天</button>
    <button data-range="30d" data-i18n="range30d">30天</button>
    <button data-range="today" data-i18n="rangeToday">今日</button>
    <button data-range="yesterday" data-i18n="rangeYesterday">昨日</button>
  </div>

  <div class="kanban-main">
    <div class="kanban-left">
      <div class="stats">
        <div class="stat"><div class="n" id="totalRequests">-</div><div class="mom" id="totalRequestsMom"></div><div class="l" data-i18n="statRequests">对话次数</div></div>
        <div class="stat"><div class="n" id="promptTokens">-</div><div class="mom" id="promptTokensMom"></div><div class="l" data-i18n="statInput">输入 Token</div></div>
        <div class="stat"><div class="n" id="completionTokens">-</div><div class="mom" id="completionTokensMom"></div><div class="l" data-i18n="statOutput">输出 Token</div></div>
      </div>

      <div class="section">
        <h2 data-i18n="trendTitle">用量趋势</h2>
        <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
      </div>

      <div class="section">
        <h2 data-i18n="billingTitle">各平台使用量</h2>
        <div id="billingList"></div>
      </div>
    </div>

    <div class="kanban-right">
      <div class="section">
        <h2 data-i18n="recentTitle">最近请求</h2>
        <div class="table-scroll">
          <table>
            <thead><tr><th data-i18n="colTime">时间</th><th data-i18n="colModel">模型</th><th data-i18n="colProvider">平台</th><th data-i18n="colInput">输入</th><th data-i18n="colOutput">输出</th><th data-i18n="statSpeed">Token/s</th></tr></thead>
            <tbody id="recentTable"></tbody>
          </table>
        </div>
        <div class="pages" id="pages"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>
const PAGE_SIZE = 100;
let page = 1, totalRecent = 0;
let currentStart = null, currentEnd = null;

const I18N = {
  zh: {
    pageTitle: 'AI Gateway',
    range1h: '1小时', range24h: '24小时', range7d: '7天', range30d: '30天', rangeToday: '今日', rangeYesterday: '昨日',
    statRequests: '对话次数', statInput: '输入 Token', statOutput: '输出 Token', statSpeed: 'Token/s',
    trendTitle: '用量趋势', billingTitle: '各平台使用量', recentTitle: '最近请求',
    colTime: '时间', colModel: '模型', colProvider: '平台', colInput: '输入', colOutput: '输出',
    prev: '上一页', next: '下一页', empty: '暂无数据', token: 'Token', requests: '请求数',
    layoutDefault: '默认', layoutKanban: '看板',
  },
  en: {
    pageTitle: 'AI Gateway',
    range1h: '1h', range24h: '24h', range7d: '7d', range30d: '30d', rangeToday: 'Today', rangeYesterday: 'Yesterday',
    statRequests: 'Conversations', statInput: 'Input Tokens', statOutput: 'Output Tokens', statSpeed: 'Token/s',
    trendTitle: 'Usage Trend', billingTitle: 'Provider Usage', recentTitle: 'Recent Requests',
    colTime: 'Time', colModel: 'Model', colProvider: 'Provider', colInput: 'Input', colOutput: 'Output',
    prev: 'Prev', next: 'Next', empty: 'No data', token: 'Token', requests: 'Requests',
    layoutDefault: 'Default', layoutKanban: 'Kanban',
  }
};

function applyLang() {
  const lang = document.documentElement.getAttribute('data-lang') || 'zh';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (I18N[lang][key]) el.textContent = I18N[lang][key];
  });
  document.getElementById('langBtn').textContent = lang === 'zh' ? 'EN' : '中';
  applyLayout();
}

function toggleLang() {
  const cur = document.documentElement.getAttribute('data-lang') || 'zh';
  const next = cur === 'zh' ? 'en' : 'zh';
  document.documentElement.setAttribute('data-lang', next);
  localStorage.setItem('ag_lang', next);
  applyLang();
  fetchAll();
  fetchRecent(page);
}

function applyTheme() {
  const theme = document.documentElement.getAttribute('data-theme') || 'dark';
  document.getElementById('themeBtn').textContent = theme === 'dark' ? 'Light' : 'Dark';
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('ag_theme', next);
  applyTheme();
  fetchAll();
  fetchRecent(page);
}

function applyLayout() {
  const lang = document.documentElement.getAttribute('data-lang') || 'zh';
  const layout = document.documentElement.getAttribute('data-layout') || 'default';
  document.getElementById('layoutBtn').textContent = layout === 'default' ? I18N[lang].layoutKanban : I18N[lang].layoutDefault;
}

function toggleLayout() {
  const cur = document.documentElement.getAttribute('data-layout') || 'default';
  const next = cur === 'default' ? 'kanban' : 'default';
  document.documentElement.setAttribute('data-layout', next);
  localStorage.setItem('ag_layout', next);
  applyLayout();
}

function initPrefs() {
  const savedTheme = localStorage.getItem('ag_theme');
  const savedLang = localStorage.getItem('ag_lang');
  const savedRange = localStorage.getItem('ag_range');
  const savedLayout = localStorage.getItem('ag_layout');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  if (savedLang) document.documentElement.setAttribute('data-lang', savedLang);
  if (savedRange) {
    document.querySelectorAll('[data-range]').forEach(b => b.classList.remove('active'));
    const btn = document.querySelector(`[data-range="${savedRange}"]`);
    if (btn) btn.classList.add('active');
  }
  if (savedLayout) document.documentElement.setAttribute('data-layout', savedLayout);
  applyTheme();
  applyLang();
  applyLayout();
}

function chartColors() {
  const theme = document.documentElement.getAttribute('data-theme') || 'dark';
  if (theme === 'light') {
    return {
      tooltipBg: '#fff', tooltipBorder: '#e5e7eb', tooltipTitle: '#111', tooltipBody: '#6b7280',
      grid: '#f3f4f6', tick: '#9ca3af', legend: '#6b7280'
    };
  }
  return {
    tooltipBg: '#1a1a1a', tooltipBorder: '#2a2a2a', tooltipTitle: '#ccc', tooltipBody: '#888',
    grid: '#1a1a1a', tick: '#555', legend: '#888'
  };
}

function p(n) { return String(n).padStart(2, '0'); }
function localISO(d) { return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
function n(v) { return v === 0 ? '0' : (v || '-').toLocaleString(); }

function renderRecent(items) {
  const lang = document.documentElement.getAttribute('data-lang') || 'zh';
  const tb = document.getElementById('recentTable');
  if (items.length === 0) {
    tb.innerHTML = `<tr><td colspan="6" class="empty">${I18N[lang].empty}</td></tr>`;
    document.getElementById('pages').innerHTML = '';
    return;
  }
  const totalPages = Math.ceil(totalRecent / PAGE_SIZE);
  if (page > totalPages) page = totalPages;
  if (page < 1) page = 1;
  const theme = document.documentElement.getAttribute('data-theme') || 'dark';
  const modelColor = theme === 'light' ? '#111' : '#ccc';
  tb.innerHTML = items.map(r => {
    const speed = r.duration_ms > 0 ? (r.completion_tokens * 1000 / r.duration_ms).toFixed(1) : '-';
    return `<tr><td style="color:var(--muted)">${r.request_time.slice(5,19)}</td><td style="color:${modelColor}">${r.model}</td><td>${r.provider}</td><td>${n(r.prompt_tokens)}</td><td>${n(r.completion_tokens)}</td><td>${speed}</td></tr>`;
  }).join('');

  let ph = '';
  const addBtn = (p, label, isActive = false, disabled = false) => {
    if (disabled) {
      ph += `<button disabled style="opacity:.4;cursor:default">${label}</button>`;
    } else {
      ph += `<button class="${isActive ? 'active' : ''}" onclick="fetchRecent(${p})">${label}</button>`;
    }
  };
  const addEllipsis = () => { ph += `<button disabled style="opacity:.4;cursor:default;border-color:transparent;background:transparent">...</button>`; };

  addBtn(page - 1, I18N[lang].prev, false, page <= 1);

  const maxVisible = 5;
  if (totalPages <= maxVisible + 2) {
    for (let i = 1; i <= totalPages; i++) addBtn(i, i, i === page);
  } else {
    addBtn(1, 1, 1 === page);
    let start = Math.max(2, page - 1);
    let end = Math.min(totalPages - 1, page + 1);
    if (page <= 3) { start = 2; end = maxVisible; }
    if (page >= totalPages - 2) { start = totalPages - maxVisible + 1; end = totalPages - 1; }
    if (start > 2) addEllipsis();
    for (let i = start; i <= end; i++) addBtn(i, i, i === page);
    if (end < totalPages - 1) addEllipsis();
    addBtn(totalPages, totalPages, totalPages === page);
  }

  addBtn(page + 1, I18N[lang].next, false, page >= totalPages);
  document.getElementById('pages').innerHTML = ph;
}

function renderChart(timeline, groupBy) {
  const merged = {};
  for (const t of timeline) {
    if (!merged[t.period]) {
      merged[t.period] = { total_tokens: 0, request_count: 0 };
    }
    merged[t.period].total_tokens += t.total_tokens;
    merged[t.period].request_count += t.request_count;
  }
  const periods = Object.keys(merged).sort();

  let labelFn;
  if (groupBy === 'minute') {
    labelFn = p => p.slice(11, 16);
  } else if (groupBy === 'day') {
    labelFn = p => p.slice(5, 10);
  } else {
    labelFn = p => p.slice(5, 16);
  }
  const labels = periods.map(labelFn);
  const tokens = periods.map(p => merged[p].total_tokens);
  const counts = periods.map(p => merged[p].request_count);
  const c = chartColors();
  const lang = document.documentElement.getAttribute('data-lang') || 'zh';

  if (window._chart) {
    window._chart.data.labels = labels;
    window._chart.data.datasets[0].data = tokens;
    window._chart.data.datasets[1].data = counts;
    window._chart.data.datasets[0].label = I18N[lang].token;
    window._chart.data.datasets[1].label = I18N[lang].requests;
    window._chart.options.plugins.legend.labels.color = c.legend;
    window._chart.options.plugins.tooltip.backgroundColor = c.tooltipBg;
    window._chart.options.plugins.tooltip.titleColor = c.tooltipTitle;
    window._chart.options.plugins.tooltip.bodyColor = c.tooltipBody;
    window._chart.options.plugins.tooltip.borderColor = c.tooltipBorder;
    window._chart.options.scales.x.ticks.color = c.tick;
    window._chart.options.scales.x.grid.color = c.grid;
    window._chart.options.scales.y.ticks.color = c.tick;
    window._chart.options.scales.y.grid.color = c.grid;
    window._chart.options.scales.y1.ticks.color = c.tick;
    window._chart.update('none');
    return;
  }

  const ctx = document.getElementById('trendChart').getContext('2d');
  window._chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: I18N[lang].token, data: tokens, borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,.08)', fill: true, pointRadius: 0, pointHoverRadius: 4, pointHitRadius: 20, tension: .2, yAxisID: 'y' },
        { label: I18N[lang].requests, data: counts, borderColor: '#6b7280', backgroundColor: 'rgba(107,114,128,.06)', fill: true, pointRadius: 0, pointHoverRadius: 4, pointHitRadius: 20, tension: .2, yAxisID: 'y1' },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: c.legend, boxWidth: 10, padding: 8, font: { size: 10 } } },
        tooltip: {
          backgroundColor: c.tooltipBg, titleColor: c.tooltipTitle, bodyColor: c.tooltipBody,
          borderColor: c.tooltipBorder, borderWidth: 1, cornerRadius: 6,
          padding: 10, titleFont: { size: 11 }, bodyFont: { size: 11 },
          callbacks: {
            label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString()}`
          }
        }
      },
      scales: {
        x: { ticks: { color: c.tick, font: { size: 9 }, maxTicksLimit: 12 }, grid: { color: c.grid } },
        y: { ticks: { color: c.tick, font: { size: 9 } }, grid: { color: c.grid }, beginAtZero: true },
        y1: { position: 'right', ticks: { color: c.tick, font: { size: 9 } }, grid: { display: false }, beginAtZero: true },
      }
    }
  });
}

function updateMom(id, current, prev) {
  const el = document.getElementById(id);
  if (!el) return;
  if (prev === undefined || prev === null) {
    el.style.display = 'none';
    return;
  }
  if (prev === 0) {
    if (current === 0) {
      el.textContent = '—';
    } else {
      el.textContent = '+∞';
    }
    el.className = 'mom';
    el.style.display = 'block';
    return;
  }
  const ratio = ((current - prev) / prev) * 100;
  const sign = ratio > 0 ? '+' : '';
  el.textContent = `${sign}${ratio.toFixed(1)}%`;
  el.className = 'mom';
  el.style.display = 'block';
}

function fetchAll() {
  const now = new Date();
  const btn = document.querySelector('[data-range].active');
  const range = btn?.dataset?.range || '24h';
  let startDate, endDate;
  if (range === 'today') {
    startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    endDate = now;
  } else if (range === 'yesterday') {
    startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
    endDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  } else {
    const hours = ({ '1h':1, '24h':24, '7d':168, '30d':720 })[range] || 24;
    startDate = new Date(now - hours * 3600000);
    endDate = now;
  }
  const s = localISO(startDate);
  const e = localISO(endDate);
  const durationMs = endDate - startDate;
  const groupBy = ({ '1h':'minute', '24h':'hour', '7d':'day', '30d':'day', 'today':'hour', 'yesterday':'hour' })[range] || 'hour';
  currentStart = s;
  currentEnd = e;

  const mainPromise = fetch('/api/usage?' + new URLSearchParams({ start: s, end: e, group_by: groupBy }))
    .then(r => r.json());

  let prevStart, prevEnd;
  if (range === 'today') {
    prevStart = localISO(new Date(startDate.getTime() - 24 * 3600000));
    prevEnd = localISO(new Date(endDate.getTime() - 24 * 3600000));
  } else {
    prevStart = localISO(new Date(startDate.getTime() - durationMs));
    prevEnd = localISO(new Date(endDate.getTime() - durationMs));
  }
  const prevPromise = fetch('/api/usage?' + new URLSearchParams({ start: prevStart, end: prevEnd }))
    .then(r => r.json());

  Promise.all([mainPromise, prevPromise]).then(([d, pd]) => {
    document.getElementById('totalRequests').textContent = n(d.totals.request_count);
    document.getElementById('promptTokens').textContent = n(d.totals.prompt_tokens);
    document.getElementById('completionTokens').textContent = n(d.totals.completion_tokens);
    renderChart(d.timeline, groupBy);

    updateMom('totalRequestsMom', d.totals.request_count, pd.totals.request_count);
    updateMom('promptTokensMom', d.totals.prompt_tokens, pd.totals.prompt_tokens);
    updateMom('completionTokensMom', d.totals.completion_tokens, pd.totals.completion_tokens);

    const bl = document.getElementById('billingList');
    const billing = d.billing || {};
    const entries = Object.entries(billing);
    if (entries.length === 0) {
      bl.innerHTML = '<div class="empty">' + (I18N[document.documentElement.getAttribute('data-lang')||'zh'].empty) + '</div>';
      return;
    }
    entries.sort((a, b) => b[1].month_used - a[1].month_used);
    const lang = document.documentElement.getAttribute('data-lang') || 'zh';
    let html = `<table><thead><tr><th>${I18N[lang].colProvider}</th><th style="text-align:right">${I18N[lang].statRequests}</th><th style="text-align:right">${I18N[lang].statInput}</th><th style="text-align:right">${I18N[lang].statOutput}</th><th style="text-align:right">${I18N[lang].statSpeed}</th></tr></thead><tbody>`;
    for (const [prov, b] of entries) {
      html += `<tr>
        <td style="color:var(--heading)">${prov}</td>
        <td style="text-align:right">${n(b.month_used)}</td>
        <td style="text-align:right">${n(b.prompt_tokens)}</td>
        <td style="text-align:right">${n(b.completion_tokens)}</td>
        <td style="text-align:right">${b.tokens_per_second > 0 ? b.tokens_per_second.toFixed(1) : '-'}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    bl.innerHTML = html;
  });
}

function fetchRecent(p) {
  page = p;
  const params = { page: page, page_size: PAGE_SIZE };
  if (currentStart && currentEnd) {
    params.start = currentStart;
    params.end = currentEnd;
  }
  fetch('/api/recent?' + new URLSearchParams(params))
    .then(r => r.json()).then(d => {
      totalRecent = d.total;
      renderRecent(d.items);
    });
}

document.querySelectorAll('[data-range]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-range]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    localStorage.setItem('ag_range', btn.dataset.range);
    page = 1;
    fetchAll();
    fetchRecent(1);
  });
});

initPrefs();
fetchAll();
fetchRecent(1);
setInterval(() => { fetchAll(); fetchRecent(page); }, 15000);
</script>
</body>
</html>
